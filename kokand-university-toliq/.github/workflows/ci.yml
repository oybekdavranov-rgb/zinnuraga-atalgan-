name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22 o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bog'liqliklar (dev)
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npx eslint .
      - name: Testlar
        run: node --test
